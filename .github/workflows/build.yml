name: Build APK Android 14+
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: sudo apt update && sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libtinfo5
      - run: pip install Cython==0.29.36 buildozer==1.5.0
      - name: Bootstrap + Install Build-Tools 37 + Fix Aidl
        run: |
          buildozer android debug || true
          SDK=~/.buildozer/android/platform/android-sdk
          TOOL=$(find $SDK -name sdkmanager -type f | head -n1)
          mkdir -p $SDK/licenses ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55a" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731e7" >> $SDK/licenses/android-sdk-license
          echo "504667632a710cb62a9f98d6921af06e39cbf85" >> $SDK/licenses/android-sdk-license
          echo "y" > $SDK/licenses/android-sdk-preview-license
          cp $SDK/licenses/* ~/.android/licenses/ || true
          yes | $TOOL --licenses || true
          yes | $TOOL --sdk_root=$SDK --install "platforms;android-34" "build-tools;34.0.0" "build-tools;37.0.0" || true
          ls $SDK/build-tools/ || true
          cp $SDK/build-tools/34.0.0/aidl $SDK/build-tools/37.0.0/aidl || true
          chmod +x $SDK/build-tools/*/aidl || true
      - name: Build APK Final Android 14+
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Gold-Scanner-Android14-APK
          path: bin/*.apk
