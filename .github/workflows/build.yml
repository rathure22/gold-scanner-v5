name: Build APK Android 14+
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: pip install Cython==0.29.36 buildozer==1.5.0
      - name: Accept licenses and install SDK 34
        run: |
          mkdir -p ${ANDROID_HOME}/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55a" > ${ANDROID_HOME}/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ${ANDROID_HOME}/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731e7" >> ${ANDROID_HOME}/licenses/android-sdk-license
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Scanner-Android14-APK
          path: bin/*.apk
