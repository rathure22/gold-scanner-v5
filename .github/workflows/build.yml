name: Build APK Android 14+
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: sudo apt update && sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
      - run: pip install Cython==0.29.36 buildozer==1.5.0
      - run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Gold-Scanner-Android14-APK
          path: bin/*.apk
