name: Build Gold Scanner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk git zip unzip ccache automake libtool pkg-config autoconf libncurses5-dev libncursesw5-dev libtinfo6 cmake zlib1g-dev libffi-dev libssl-dev lld build-essential

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "y"
      run: |
        buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Scanner-V5-APK
          path: bin/*.apk
          if-no-files-found: error

